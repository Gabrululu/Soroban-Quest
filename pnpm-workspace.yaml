# Supply-chain guard: skip package versions published less than 24 h ago (minutes).
minimumReleaseAge: 1440

overrides:
  rolldown: 1.2.1

# Install scripts are blocked unless listed here as true.
allowBuilds:
  esbuild: true
  workerd: true
  # Optional native speed-ups pulled in by wallet SDKs; the JS fallbacks are enough.
  bufferutil: false
  utf-8-validate: false
  secp256k1: false
  "@reown/appkit": false
  # The sentry-cli binary arrives as a per-platform optional dependency; its postinstall is only
  # a download fallback.
  "@sentry/cli": false
